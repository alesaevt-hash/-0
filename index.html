<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор турникетов ZKTeco</title>
    <style>
        :root {
            --zk-green: #00a859;
            --zk-blue: #0072ce;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 18px;
        }

        header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .zk-badge {
            background: var(--zk-green);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Выбор модели турникета */
        .model-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #334155;
            flex-wrap: wrap;
            justify-content: center;
        }

        .model-tab {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .model-tab.active {
            background: var(--zk-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 114, 206, 0.4);
        }

        /* Рабочая зона */
        .workspace {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1050px;
            width: 100%;
        }

        /* Сцена турникета */
        .turnstile-stage {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            flex: 1 1 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            min-height: 360px;
        }

        .status-banner {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
        }

        .turnstile-scene {
            position: relative;
            width: 100%;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- МОДЕЛЬ 1: ZKTeco TS2000 Pro (Трипод) --- */
        .cabinet-pro {
            position: relative;
            width: 260px;
            height: 85px;
            background: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 50%, #64748b 100%);
            border-radius: 40px;
            border: 2px solid #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 12px 22px rgba(0,0,0,0.6);
        }
        .glass-top {
            position: absolute;
            top: 4px; left: 45px; right: 45px; height: 73px;
            background: #0f172a;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border: 1px solid #334155;
        }
        .tripod-hub-pro {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 20px; background: #334155; border-radius: 0 0 6px 6px;
        }
