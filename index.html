<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расширенный симулятор турникетов ZKTeco</title>
    <style>
        :root {
            --zk-green: #00a859;
            --zk-blue: #0072ce;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .zk-badge {
            background: var(--zk-green);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* Выбор модели турникета */
        .model-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .model-tab {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .model-tab.active {
            background: var(--zk-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 114, 206, 0.4);
        }

        /* Рабочая зона */
        .workspace {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1100px;
            width: 100%;
        }

        /* Сцена турникета */
        .turnstile-stage {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            flex: 1 1 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            min-height: 380px;
        }

        .status-banner {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .turnstile-scene {
            position: relative;
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- МОДЕЛЬ 1: Трипод TS1000 --- */
        .model-ts1000 .cabinet {
            position: relative;
            width: 240px;
            height: 90px;
            background: linear-gradient(180deg, #f1f5f9 0%, #cbd5e1 40%, #94a3b8 100%);
            border-radius: 12px;
            border: 2px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .model-ts1000 .top-trim {
            position: absolute;
            top: 6px; left: 40px; right: 40px; height: 74px;
            background: #1e293b; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .model-ts1000 .tripod-hub {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            width: 32px; height: 20px; background: #334155; border-radius: 0 0 6px 6px;
        }
        .model-ts1000 .barrier-arm {
            position: absolute; top: 12px; left: 50%; width: 12px; height: 105px; margin-left: -6px;
            background: linear-gradient(90deg, #cbd5e1, #fff, #64748b);
            border-radius: 4px; transform-origin: top center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
        }
        .model-ts1000 .barrier-arm::after {
            content: ''; position: absolute; bottom: 6px; left: 0; right: 0; height: 10px; background: #ef4444;
        }
        .model-ts1000 .barrier-arm.dropped {
            transform: scaleY(0.15) rotateX(75deg); opacity: 0.5; background: #f59e0b;
        }
        .model-ts1000 .barrier-arm.spin-l { animation: spinL 0.5s ease-in-out; }
        .model-ts1000 .barrier-arm.spin-r { animation: spinR 0.5s ease-in-out; }
        @keyframes spinL { 0% {transform: rotate(0);} 50% {transform: rotate(70deg) scaleY(0.3);} 100% {transform: rotate(0);} }
        @keyframes spinR { 0% {transform: rotate(0);} 50% {transform: rotate(-70deg) scaleY(0.3);} 100% {transform: rotate(0);} }


        /* --- МОДЕЛЬ 2: Скоростной турникет SBTL3000 (Створки) --- */
        .model-sbtl .speed-gate-body {
            display: flex;
            width: 320px;
            height: 90px;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .pillar {
            width: 70px;
            height: 90px;
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #64748b;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        }
        .glass-gate {
            position: absolute;
            top: 35px;
            width: 90px;
            height: 20px;
            background: rgba(56, 189, 248, 0.35);
            border: 2px solid #38bdf8;
            border-radius: 4px;
            transition: all 0.35s ease;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .glass-left { left: 65px; transform-origin: left center; }
        .glass-right { right: 65px; transform-origin: right center; }

        /* Открытие створок */
        .model-sbtl.open-l .glass-left { transform: rotate(-75deg) scaleX(0.7); opacity: 0.3; }
        .model-sbtl.open-r .glass-right { transform: rotate(75deg) scaleX(0.7); opacity: 0.3; }
        .model-sbtl.open-both .glass-left { transform: rotate(-75deg) scaleX(0.7); opacity: 0.3; }
        .model-sbtl.open-both .glass-right { transform: rotate(75deg) scaleX(0.7); opacity: 0.3; }


        /* --- МОДЕЛЬ 3: Полноростовой роторный FHT2200 --- */
        .model-full {
            position: relative;
            width: 220px;
            height: 180px;
            background: linear-gradient(180deg, #334155, #0f172a);
            border: 3px solid #64748b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px #000;
        }
        .full-rotor {
            position: absolute;
            width: 100px;
            height: 160px;
            border: 2px dashed #94a3b8;
            border-radius: 50%;
            transition: transform 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .full-rotor::before {
            content: '╇';
            font-size: 3.5rem;
            color: #cbd5e1;
        }
        .model-full.spin-l .full-rotor { transform: rotate(120deg); }
        .model-full.spin-r .full-rotor { transform: rotate(-120deg); }


        /* Светодиоды */
        .led-panel {
            width: 22px; height: 48px; background: #090d16; border-radius: 4px;
            border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold;
        }
        .led-red { color: #ef4444; text-shadow: 0 0 6px #ef4444; }
        .led-green { color: #22c55e; text-shadow: 0 0 8px #22c55e; animation: pulse 0.7s infinite alternate; }
        @keyframes pulse { from {opacity: 0.5;} to {opacity: 1;} }

        /* Кнопка считывателя */
        .rfid-box {
            background: #0f172a; border: 1px solid var(--zk-blue); border-radius: 4px;
            padding: 4px 8px; cursor: pointer; text-align: center; font-size: 0.7rem; color: #38bdf8;
            margin-top: 4px;
        }
        .rfid-box:hover { background: rgba(0,114,206,0.2); }

        .pass-action-area {
            margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        }
        .sim-btn {
            background: #334155; color: #f8fafc; border: 1px solid #475569;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
        }
        .sim-btn:hover { background: #475569; }

        /* ПУЛЬТ УПРАВЛЕНИЯ */
        .remote-control {
            background: linear-gradient(145deg, #273449, #1a2332);
            border: 2px solid #475569; border-radius: 20px; padding: 22px; width: 330px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 14px;
        }
        .remote-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; padding-bottom: 10px; font-size: 0.9rem; font-weight: 700;
        }
        .remote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .ctrl-btn {
            position: relative; background: #1e293b; border: 2px solid #334155; border-radius: 10px;
            padding: 14px 8px; color: #f8fafc; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 #0f172a;
            transition: all 0.1s;
        }
        .ctrl-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0f172a; }
        .ctrl-btn .icon { font-size: 1.4rem; }
        .ctrl-btn .label { font-size: 0.78rem; font-weight: 700; text-align: center; }
        .ctrl-btn .led-dot {
            position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #334155;
        }

        .ctrl-btn.active-green { border-color: #22c55e; background: rgba(34, 197, 94, 0.15); }
        .ctrl-btn.active-green .led-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .ctrl-btn.active-amber { border-color: #f59e0b; background: rgba(245, 158, 11, 0.18); }
        .ctrl-btn.active-amber .led-dot { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }
        .ctrl-btn.active-red { border-color: #ef4444; background: rgba(239, 68, 68, 0.18); }
        .ctrl-btn.active-red .led-dot { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

        .span-2 { grid-column: span 2; }

        .counters {
            display: flex; justify-content: space-between; background: #0f172a; padding: 10px;
            border-radius: 8px; border: 1px solid #334155; font-size: 0.8rem;
        }
        .counters span { color: #38bdf8; font-weight: bold; }

        /* Лог */
        .log-panel {
            width: 100%; max-width: 1070px; margin-top: 20px; background: #1e293b;
            border: 1px solid #334155; border-radius: 12px; padding: 14px;
        }
        .log-list {
            height: 120px; overflow-y: auto; background: #0f172a; border-radius: 8px;
            padding: 8px; font-family: 'Consolas', monospace; font-size: 0.78rem; display: flex; flex-direction: column; gap: 4px;
        }
        .log-item { display: flex; gap: 8px; border-bottom: 1px solid #161e2e; padding-bottom: 3px; }
        .log-time { color: #64748b; }
        .log-info { color: #e2e8f0; }
        .log-warn { color: #fbbf24; }
        .log-danger { color: #f87171; }
        .log-success { color: #4ade80; }
    </style>
</head>
<body>

    <header>
        <h1><span class="zk-badge">ZKTeco</span> Симулятор проходной</h1>
        <p class="subtitle">Выберите модель турникета • Используйте двойной клик на пульте для постоянного прохода</p>
    </header>

    <!-- Переключатель моделей турникетов -->
    <div class="model-selector">
        <button class="model-tab active" onclick="switchModel('ts1000')">1. Трипод TS1000</button>
        <button class="model-tab" onclick="switchModel('sbtl')">2. Скоростной SBTL3000</button>
        <button class="model-tab" onclick="switchModel('full')">3. Полноростовой FHT2200</button>
    </div>

    <div class="workspace">
        <!-- Визуализация турникета -->
        <div class="turnstile-stage" id="stageContainer">
            <div class="status-banner">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">ШТАТНЫЙ РЕЖИМ (ЗАКРЫТО)</span>
            </div>

            <div class="turnstile-scene" id="turnstileView">
                <!-- Динамически рендерится через JS -->
            </div>

            <div class="pass-action-area">
                <button class="sim-btn" onclick="attemptPass('left')">🚶‍♂️ Имитация прохода ВЛЕВО</button>
                <button class="sim-btn" onclick="attemptPass('right')">🚶‍♂️ Имитация прохода ВПРАВО</button>
            </div>
        </div>

        <!-- Пульт управления -->
        <div class="remote-control">
            <div class="remote-header">
                <span>Пульт ДУ турникетом</span>
                <span style="font-size: 0.7rem; color: #64748b;">⚡ Двойной клик = Свободно</span>
            </div>

            <div class="remote-grid">
                <button class="ctrl-btn" id="btnLeft" onclick="handleButtonAction('left')">
                    <span class="led-dot"></span>
                    <span class="icon">⬅️</span>
                    <span class="label">ВЛЕВО<br>(Вход)</span>
                </button>

                <button class="ctrl-btn" id="btnRight" onclick="handleButtonAction('right')">
                    <span class="led-dot"></span>
                    <span class="icon">➡️</span>
                    <span class="label">ВПРАВО<br>(Выход)</span>
                </button>

                <button class="ctrl-btn span-2" id="btnPanic" onclick="handleButtonAction('panic')">
                    <span class="led-dot"></span>
                    <span class="icon">⚠️</span>
                    <span class="label">АНТИПАНИКА (Сброс / Открытие)</span>
                </button>

                <button class="ctrl-btn span-2" id="btnLock" onclick="handleButtonAction('lock')">
                    <span class="led-dot"></span>
                    <span class="icon">🔒</span>
                    <span class="label">ПРИНУДИТЕЛЬНАЯ БЛОКИРОВКА</span>
                </button>
            </div>

            <div class="counters">
                <div>Входов: <span id="countLeft">0</span></div>
                <div>Выходов: <span id="countRight">0</span></div>
            </div>
        </div>
    </div>

    <!-- Журнал событий -->
    <div class="log-panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:0.85rem; color:#94a3b8;">
            <span>📋 Системный лог контроллера</span>
            <button onclick="document.getElementById('logList').innerHTML=''" style="background:none; border:none; color:#94a3b8; cursor:pointer;">Очистить</button>
        </div>
        <div class="log-list" id="logList"></div>
    </div>

    <script>
        let currentModel = 'ts1000'; // 'ts1000', 'sbtl', 'full'
        let state = 'IDLE'; // 'IDLE', 'OPEN_LEFT', 'OPEN_RIGHT', 'FREE_LEFT', 'FREE_RIGHT', 'PANIC', 'LOCKED'
        let countLeft = 0;
        let countRight = 0;
        let autoCloseTimer = null;
        let lastClickTime = 0;
        let lastClickButton = '';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function addLog(msg, type = 'info') {
            const list = document.getElementById('logList');
            const time = new Date().toLocaleTimeString('ru-RU');
            list.innerHTML = `<div class="log-item"><span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span></div>` + list.innerHTML;
        }

        function switchModel(model) {
            currentModel = model;
            document.querySelectorAll('.model-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            state = 'IDLE';
            renderModelHTML();
            updateUI();
            addLog(`Переключение модели турникета на: ${model.toUpperCase()}`, 'info');
        }

        function renderModelHTML() {
            const container = document.getElementById('turnstileView');
            if (currentModel === 'ts1000') {
                container.className = 'turnstile-scene model-ts1000';
                container.innerHTML = `
                    <div class="cabinet">
                        <div class="led-panel led-red" id="ledLeft">✖</div>
                        <div class="top-trim">
                            <span style="color:#fff; font-weight:800; font-size:0.8rem;">ZK<span style="color:var(--zk-green)">Teco</span></span>
                            <div class="rfid-box" onclick="simulateCard()">RFID 💳</div>
                        </div>
                        <div class="led-panel led-red" id="ledRight">✖</div>
                        <div class="tripod-hub"><div class="barrier-arm" id="barrierArm"></div></div>
                    </div>`;
            } else if (currentModel === 'sbtl') {
                container.className = 'turnstile-scene model-sbtl';
                container.innerHTML = `
                    <div class="speed-gate-body">
                        <div class="pillar">
                            <div class="led-panel led-red" id="ledLeft" style="height:36px; width:18px; font-size:0.8rem;">✖</div>
                            <div class="rfid-box" style="font-size:0.5rem; padding:2px;" onclick="simulateCard()">RFID</div>
                        </div>
                        <div class="glass-gate glass-left"></div>
                        <div class="glass-gate glass-right"></div>
                        <div class="pillar">
                            <div class="led-panel led-red" id="ledRight" style="height:36px; width:18px; font-size:0.8rem;">✖</div>
                            <div class="rfid-box" style="font-size:0.5rem; padding:2px;" onclick="simulateCard()">RFID</div>
                        </div>
                    </div>`;
            } else if (currentModel === 'full') {
                container.className = 'turnstile-scene model-full';
                container.innerHTML = `
                    <div style="position:absolute; left:10px; display:flex; gap:5px;">
                        <div class="led-panel led-red" id="ledLeft">✖</div>
                    </div>
                    <div class="full-rotor" id="fullRotor"></div>
                    <div style="position:absolute; right:10px; display:flex; gap:5px;">
                        <div class="led-panel led-red" id="ledRight">✖</div>
                    </div>
                    <div style="position:absolute; bottom:5px;" class="rfid-box" onclick="simulateCard()">Приложить карту 💳</div>`;
            }
        }

        // Обработка кликов на пульте с детектированием двойного нажатия (для свободного прохода)
        function handleButtonAction(btnName) {
            const now = Date.now();
            const isDouble = (btnName === lastClickButton && (now - lastClickTime) < 1200);
            lastClickButton = btnName;
            lastClickTime = now;

            if (btnName === 'left') {
                if (isDouble) {
                    state = (state === 'FREE_LEFT') ? 'IDLE' : 'FREE_LEFT';
                    addLog(state === 'FREE_LEFT' ? 'Режим постоянного свободного прохода ВЛЕВО активирован!' : 'Свободный проход выключен.', 'success');
                    playTone(950, 'sine', 0.2);
                } else {
                    cmdUnlock('left');
                }
            } else if (btnName === 'right') {
                if (isDouble) {
                    state = (state === 'FREE_RIGHT') ? 'IDLE' : 'FREE_RIGHT';
                    addLog(state === 'FREE_RIGHT' ? 'Режим постоянного свободного прохода ВПРАВО активирован!' : 'Свободный проход выключен.', 'success');
                    playTone(950, 'sine', 0.2);
                } else {
                    cmdUnlock('right');
                }
            } else if (btnName === 'panic') {
                cmdAntiPanic();
            } else if (btnName === 'lock') {
                cmdForceLock();
            }
            updateUI();
        }

        function cmdUnlock(dir) {
            if (state === 'PANIC' || state === 'LOCKED') return;
            clearTimeout(autoCloseTimer);
            playTone(800, 'sine', 0.15);
            state = (dir === 'left') ? 'OPEN_LEFT' : 'OPEN_RIGHT';
            addLog(`Пульт: Однократный проход ${dir === 'left' ? 'ВЛЕВО' : 'ВПРАВО'} разрешен.`, 'success');

            autoCloseTimer = setTimeout(() => {
                if (state === 'OPEN_LEFT' || state === 'OPEN_RIGHT') {
                    state = 'IDLE';
                    addLog('Тайм-аут прохода (5 сек). Турникет закрыт.', 'info');
                    updateUI();
                }
            }, 5000);
        }

        function cmdAntiPanic() {
            clearTimeout(autoCloseTimer);
            if (state !== 'PANIC') {
                state = 'PANIC';
                playTone(550, 'square', 0.3);
                addLog('⚠️ АКТИВИРОВАН РЕЖИМ АНТИПАНИКА! Электропитание снято, проход полностью свободен.', 'warn');
            } else {
                state = 'IDLE';
                playTone(450, 'sine', 0.2);
                addLog('Режим АНТИПАНИКА снят. Система в штатном режиме.', 'info');
            }
        }

        function cmdForceLock() {
            clearTimeout(autoCloseTimer);
            if (state !== 'LOCKED') {
                state = 'LOCKED';
                playTone(200, 'sawtooth', 0.3);
                addLog('🔒 ПРИНУДИТЕЛЬНАЯ БЛОКИРОВКА. Проход заблокирован.', 'danger');
            } else {
                state = 'IDLE';
                playTone(450, 'sine', 0.15);
                addLog('Блокировка снята.', 'info');
            }
        }

        function simulateCard() {
            if (state === 'LOCKED') {
                playTone(150, 'sawtooth', 0.3);
                addLog('Карта отклонена: турникет заблокирован.', 'danger');
                return;
            }
            addLog('RFID карта считана. Доступ разрешен.', 'success');
            cmdUnlock('left');
            updateUI();
        }

        function attemptPass(dir) {
            const ledL = document.getElementById('ledLeft');
            const ledR = document.getElementById('ledRight');

            if (state === 'PANIC' || state === 'FREE_LEFT' || state === 'FREE_RIGHT' || 
               (dir === 'left' && state === 'OPEN_LEFT') || (dir === 'right' && state === 'OPEN_RIGHT')) {
                
                playTone(1100, 'sine', 0.1);
                if (dir === 'left') { countLeft++; document.getElementById('countLeft').textContent = countLeft; }
                else { countRight++; document.getElementById('countRight').textContent = countRight; }

                addLog(`Успешный проход ${dir === 'left' ? 'влево' : 'вправо'}.`, 'success');

                // Анимация вращения/створок
                if (currentModel === 'ts1000') {
                    const arm = document.getElementById('barrierArm');
                    if (arm) { arm.classList.add(dir === 'left' ? 'spin-l' : 'spin-r'); setTimeout(()=>arm.classList.remove('spin-l','spin-r'), 500); }
                } else if (currentModel === 'sbtl') {
                    const container = document.getElementById('stageContainer');
                    container.classList.add(dir === 'left' ? 'open-l' : 'open-r');
                    setTimeout(()=>container.classList.remove('open-l','open-r'), 800);
                } else if (currentModel === 'full') {
                    const rotor = document.getElementById('fullRotor');
                    if(rotor) { rotor.style.transform = dir==='left'?'rotate(120deg)':'rotate(-120deg)'; setTimeout(()=>rotor.style.transform='rotate(0deg)', 500); }
                }

                if (state === 'OPEN_LEFT' || state === 'OPEN_RIGHT') {
                    state = 'IDLE';
                    updateUI();
                }
            } else {
                playTone(140, 'sawtooth', 0.3);
                addLog(`ПОПЫТКА НЕСАНКЦИОНИРОВАННОГО ПРОХОДА (${dir}) заблокирована!`, 'danger');
            }
        }

        function updateUI() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const ledL = document.getElementById('ledLeft');
            const ledR = document.getElementById('ledRight');
            const stage = document.getElementById('stageContainer');

            const btnL = document.getElementById('btnLeft');
            const btnR = document.getElementById('btnRight');
            const btnP = document.getElementById('btnPanic');
            const btnK = document.getElementById('btnLock');

            btnL.className = 'ctrl-btn'; btnR.className = 'ctrl-btn';
            btnP.className = 'ctrl-btn span-2'; btnK.className = 'ctrl-btn span-2';

            if (currentModel === 'ts1000') {
                const arm = document.getElementById('barrierArm');
                if(arm) arm.classList.remove('dropped');
            }

            if (state === 'IDLE') {
                statusDot.style.background = '#64748b'; statusText.textContent = 'ШТАТНЫЙ РЕЖИМ (ЗАКРЫТО)';
                if(ledL) { ledL.className = 'led-panel led-red'; ledL.textContent = '✖'; }
                if(ledR) { ledR.className = 'led-panel led-red'; ledR.textContent = '✖'; }
            } else if (state === 'OPEN_LEFT' || state === 'FREE_LEFT') {
                statusDot.style.background = '#22c55e'; statusText.textContent = state === 'FREE_LEFT' ? 'СВОБОДНЫЙ ПРОХОД ВЛЕВО (ПОСТОЯННО)' : 'РАЗРЕШЕН ПРОХОД ВЛЕВО';
                if(ledL) { ledL.className = 'led-panel led-green'; ledL.textContent = '⬅'; }
                if(ledR) { ledR.className = 'led-panel led-red'; ledR.textContent = '✖'; }
                btnL.classList.add('active-green');
            } else if (state === 'OPEN_RIGHT' || state === 'FREE_RIGHT') {
                statusDot.style.background = '#22c55e'; statusText.textContent = state === 'FREE_RIGHT' ? 'СВОБОДНЫЙ ПРОХОД ВПРАВО (ПОСТОЯННО)' : 'РАЗРЕШЕН ПРОХОД ВПРАВО';
                if(ledL) { ledL.className = 'led-panel led-red'; ledL.textContent = '✖'; }
                if(ledR) { ledR.className = 'led-panel led-green'; ledR.textContent = '➡'; }
                btnR.classList.add('active-green');
            } else if (state === 'PANIC') {
                statusDot.style.background = '#f59e0b'; statusText.textContent = 'ТРЕВОГА: АНТИПАНИКА ОТКРЫТА';
                if(ledL) { ledL.className = 'led-panel led-green'; ledL.textContent = '⬇'; }
                if(ledR) { ledR.className = 'led-panel led-green'; ledR.textContent = '⬇'; }
                btnP.classList.add('active-amber');
                if (currentModel === 'ts1000') {
                    const arm = document.getElementById('barrierArm');
                    if(arm) arm.classList.add('dropped');
                } else if (currentModel === 'sbtl') {
                    stage.classList.add('open-both');
                }
            } else if (state === 'LOCKED') {
                statusDot.style.background = '#ef4444'; statusText.textContent = 'ПРИНУДИТЕЛЬНАЯ БЛОКИРОВКА';
                if(ledL) { ledL.className = 'led-panel led-red'; ledL.textContent = '⛔'; }
                if(ledR) { ledR.className = 'led-panel led-red'; ledR.textContent = '⛔'; }
                btnK.classList.add('active-red');
            }
        }

        // Инициализация при стартах
        renderModelHTML();
        updateUI();
        addLog('Симулятор инициализирован. Выберите турникет.', 'info');
    </script>
</body>
</html>
